<!DOCTYPE html>
<html>
  <head>
    <title>Smart City 3D Dashboard</title>
    <style>
      /* Reset margins and ensure the map fills the whole screen */
      body { margin: 0; padding: 0; }
      #map {
        height: 100vh;
        width: 100%;
      }
    </style> 
  </head>
  <body>
    <!-- The container where the map will be drawn -->
    <div id="map"></div>

    <script>
      let map;

      async function initMap() {
        // Request the Maps library
        const { Map } = await google.maps.importLibrary("maps");

        // Initialize the 3D Vector Map
        map = new Map(document.getElementById("map"), {
          center: { lat: 45.0703, lng: 7.6869 }, // Coordinates for Turin
          zoom: 18,                              // High zoom to see buildings
          mapId: "8c2ede0d88498b2ab59f151f",     // 🔴 PASTE YOUR MAP ID HERE
          tilt: 65,                              // Angles the camera down (max 67.5)
          heading: 45,                           // Rotates the camera angle
          disableDefaultUI: true,                // Hides standard Google map buttons for a clean dashboard
        });
      }
    </script>
    
    <!-- Modern Google Maps API Loader -->
    <script>
      (g=>{var h,a,k,p="The Google Maps JavaScript API",c="google",l="importLibrary",q="__ib__",m=document,b=window;b=b[c]||(b[c]={});var d=b.maps||(b.maps={}),r=new Set,e=new URLSearchParams,u=()=>h||(h=new Promise(async(f,n)=>{await (a=m.createElement("script"));e.set("libraries",[...r]+"");for(k in g)e.set(k.replace(/[A-Z]/g,t=>"_"+t[0].toLowerCase()),g[k]);e.set("callback",c+".maps."+q);a.src=`https://maps.${c}apis.com/maps/api/js?`+e;d[q]=f;a.onerror=()=>h=n(Error(p+" could not load."));a.nonce=m.querySelector("script[nonce]")?.nonce||"";m.head.append(a)}));d[l]?console.warn(p+" only loads once. Ignoring:",g):d[l]=(f,...n)=>r.add(f)&&u().then(()=>d[l](f,...n))})({
        key: "AIzaSyDZ9eaOmW320s4vZ3ordSQDEp1GT0MwbqI",          // 🔴 PASTE YOUR API KEY HERE
        v: "weekly",
      });
      
      initMap();
    </script>
  </body>
</html>
